<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep Dark Rounded Background -->
  <rect width="64" height="64" rx="16" fill="#0B0C0F" />
  
  <!-- Subtle Gold Border Accent -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#F5C518" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Bold Rupee Symbol (₹) in Gold -->
  <text 
    x="32" 
    y="46" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="42" 
    font-weight="900" 
    fill="#F5C518" 
    text-anchor="middle"
  >₹</text>
</svg>