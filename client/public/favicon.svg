<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="jsn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222D" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>
    <linearGradient id="jsn-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="50%" stop-color="#F5C518" />
      <stop offset="100%" stop-color="#E5A800" />
    </linearGradient>
    <linearGradient id="jsn-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5C518" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4E95FF" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#jsn-bg)" stroke="#2D3342" stroke-width="2" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#jsn-gold)" stroke-width="1" stroke-opacity="0.3" />

  <!-- Modern Geometric 'J' + Spark Node -->
  <!-- Top bar of J -->
  <path d="M22 17H44C45.6569 17 47 18.3431 47 20V23C47 24.6569 45.6569 26 44 26H35V37C35 41.9706 30.9706 46 26 46C21.0294 46 17 41.9706 17 37C17 35.3431 18.3431 34 20 34C21.6569 34 23 35.3431 23 37C23 38.6569 24.3431 40 26 40C27.6569 40 29 38.6569 29 37V26H22C20.3431 26 19 24.6569 19 23V20C19 18.3431 20.3431 17 22 17Z" fill="url(#jsn-gold)" filter="url(#glow)" />

  <!-- Dynamic Sparkle/Node on top right -->
  <circle cx="43" cy="37" r="4" fill="url(#jsn-gold)" />
  <path d="M43 31V43M37 37H49" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
</svg>